name: 📖 Documentation
description: Docs are wrong, missing, or claim something the code does not do
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File, page, or URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: |
        Including "the README says this works and it does not" — that is a
        documentation bug and a welcome report.
    validations:
      required: true
